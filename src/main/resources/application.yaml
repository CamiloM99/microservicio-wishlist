server:
  port: 8083
  servlet:
    context-path: /api/v1/

spring:
  application:
    name: wishlist-service
  datasource:
    url: jdbc:mysql://localhost:3306/carvajal_db
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

products:
  service:
    url: http://localhost:8082/api/v1/products
